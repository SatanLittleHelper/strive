name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Готовый тег образов для выкладки без сборки (откат), например sha-0123456789ab. Пусто — собрать текущий коммит'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      prefix: ${{ steps.vars.outputs.prefix }}
      build: ${{ steps.vars.outputs.build }}
      ref: ${{ steps.vars.outputs.ref }}
    steps:
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strive" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "Недопустимый тег: $INPUT_TAG" >&2
              exit 1
            fi
            {
              echo "tag=$INPUT_TAG"
              echo "build=false"
              echo "ref=$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            sha="${RUN_SHA:-$GITHUB_SHA}"
            {
              echo "tag=sha-${sha:0:12}"
              echo "build=true"
              echo "ref=$sha"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web, migrate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.target }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.target }}:latest
          cache-from: type=gha,scope=strive
          cache-to: type=gha,mode=max,scope=strive

  deploy:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Настроить SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Скопировать compose на VPS
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes devops/compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/strive/compose.prod.yml"
      - name: Выложить образы
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$TAG'" <<'REMOTE'
          set -euo pipefail
          cd /opt/strive
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env
          else
            echo "IMAGE_TAG=$1" >> .env
          fi
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d --remove-orphans
          REMOTE
      - name: Проверить сайт через Cloudflare
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "https://$DEPLOY_DOMAIN/healthz" && curl -fsS "https://$DEPLOY_DOMAIN/api/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "Сайт не ответил за 60 секунд" >&2
          exit 1
