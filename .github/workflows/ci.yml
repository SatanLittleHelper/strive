name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # e2e уже прошли в PR, при мердже в main их не повторяем
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Версия образа должна совпадать с @playwright/test в package-lock.json (проверяется ниже)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strive
          POSTGRES_PASSWORD: strive
          POSTGRES_DB: strive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strive -d strive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://strive:strive@postgres:5432/strive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Проверить, что образ соответствует версии Playwright
        run: |
          installed="$(npx playwright --version | awk '{print $2}')"
          image="${PLAYWRIGHT_IMAGE_TAG#v}"
          image="${image%-*}"
          test "$installed" = "$image" || { echo "Playwright $installed != образ $image"; exit 1; }
        env:
          PLAYWRIGHT_IMAGE_TAG: v1.64.1-noble
      - run: npm run db:migrate
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            tmp/playwright/
