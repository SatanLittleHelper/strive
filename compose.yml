services:
  api:
    build:
      context: .
      dockerfile: devops/Dockerfile
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: devops/Dockerfile
      target: web
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
