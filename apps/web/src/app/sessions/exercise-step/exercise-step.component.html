<section class="grid gap-4" [attr.aria-label]="item().exercise.name">
	<div
		appearance="neutral"
		aria-label="План и ввод подхода"
		class="mt-4 pt-8"
		role="group"
		tuiCardLarge="compact"
	>
		<div class="grid gap-4">
			<app-set-rings
				[editorSet]="editorSet()"
				[plannedSets]="item().sets"
				[reps]="item().reps"
				[ringMax]="ringMax()"
				[savedCount]="savedCount()"
				[weight]="item().weight"
			/>
			@if (formSet(); as set) {
				@if (defaults(); as values) {
					<app-set-editor
						[defaults]="values"
						[disabled]="disabled()"
						[editorSet]="set"
						[workoutExerciseId]="item().id"
						[fillRequest]="fillRequest()"
						[result]="savedResult()"
						[results]="session().results"
						[sessionId]="session().id"
						(pendingChange)="pendingChange.emit($event)"
						(saved)="saved.emit($event)"
					/>
				}
				@if (set.mode === 'edit') {
					<button
						appearance="secondary"
						size="m"
						tuiButton
						type="button"
						[disabled]="disabled()"
						(click)="cancelEdit.emit()"
					>
						Отменить правку
					</button>
				}
			}
		</div>
	</div>
	@if (formSet() === null) {
		<section appearance="neutral" aria-label="Упражнение выполнено" class="grid gap-3" tuiCardLarge>
			<h3 tuiTitle>Упражнение выполнено</h3>
		</section>
	}
	<app-exercise-history
		[disabled]="disabled()"
		[fillDisabled]="formSet() === null"
		[groups]="groups()"
		[status]="historyStatus()"
		[today]="today()"
		(editSet)="startEdit($event)"
		(fillSet)="applyHistory($event)"
		(retry)="retryHistory.emit()"
	/>
</section>
