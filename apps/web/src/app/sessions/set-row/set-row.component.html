<div class="grid gap-3">
	<button
		appearance="secondary"
		tuiButton
		type="button"
		class="w-full"
		[attr.aria-expanded]="expanded()"
		[disabled]="disabled() || saving()"
		(click)="toggle()"
	>
		Подход {{ setNumber() }}
		@if (result(); as saved) {
			<span tuiBadge appearance="positive">Выполнен</span>
			<span>{{ saved.weight }} кг × {{ saved.reps }}</span>
		}
	</button>
	@if (expanded()) {
		<form
			class="grid gap-3"
			novalidate
			[formGroup]="form"
			(ngSubmit)="save()"
			[attr.aria-label]="'Подход ' + setNumber()"
		>
			<div class="grid grid-cols-2 gap-3">
				<div class="grid gap-1">
					<!-- вес ограничен min/max самой Taiga: ввод за границей обрезается без ошибки -->
					<tui-textfield>
						<label tuiLabel>Вес, кг</label>
						<input
							tuiInputNumber
							formControlName="weight"
							[min]="weightMin"
							[max]="limits.weightMax"
							[step]="0.5"
						/>
					</tui-textfield>
					<tui-error formControlName="weight" />
				</div>
				<div class="grid gap-1">
					<tui-textfield>
						<label tuiLabel>Повторы</label>
						<input tuiInputNumber formControlName="reps" [step]="1" />
					</tui-textfield>
					<tui-error formControlName="reps" />
				</div>
			</div>
			<div class="grid gap-1">
				<tui-textfield>
					<label tuiLabel>RPE (1–5, необязательно)</label>
					<input tuiInputNumber formControlName="rpe" [step]="1" />
				</tui-textfield>
				<tui-error formControlName="rpe" />
			</div>
			<div class="grid gap-1">
				<!-- maxLength не даёт ввести длинную заметку, поэтому ошибка длины здесь недостижима -->
				<tui-textfield>
					<label tuiLabel>Заметка</label>
					<textarea tuiTextarea formControlName="note" [maxLength]="limits.noteMaxLength"></textarea>
				</tui-textfield>
				<tui-error formControlName="note" />
			</div>
			@if (error()) {
				<div tuiNotification appearance="negative" role="alert">{{ error() }}</div>
			}
			<button tuiButton type="submit" [disabled]="saving() || disabled()">
				{{ saving() ? 'Сохранение…' : 'Сохранить подход' }}
			</button>
		</form>
	}
</div>
