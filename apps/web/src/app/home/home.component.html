<section class="grid gap-3 py-8">
	<p class="text-xs font-semibold uppercase tracking-widest text-text-muted">Дневник тренировок</p>
	<h1 class="text-5xl font-extrabold tracking-tight">Strive</h1>
	<p class="text-sm text-text-muted">
		Каждая тренировка приближает к цели. Выберите план и начинайте.
	</p>
</section>
<app-resource-state
	errorMessage="Не удалось загрузить главную"
	hideEmpty
	loadingLabel="Загрузка главной"
	[state]="state()"
	(retry)="reload()"
>
	<div aria-hidden="true" appearance="neutral" loading tuiCardLarge [tuiSkeleton]="true">
		<header tuiHeader>
			<h2 tuiTitle>Тренировка<span tuiSubtitle>Загрузка тренировки</span></h2>
		</header>
	</div>
	@if (card(); as data) {
		@switch (data.kind) {
			@case ('active') {
				<app-continue-banner [workoutName]="data.workoutName" />
			}
			@case ('next') {
				<app-next-workout [workout]="data.workout" />
			}
		}
	}
</app-resource-state>
