<app-resource-state
	errorMessage="Не удалось загрузить следующую тренировку"
	hideEmpty
	loadingLabel="Загрузка следующей тренировки"
	[state]="state()"
	(retry)="reload()"
>
	<div aria-hidden="true" appearance="neutral" loading tuiCardLarge [tuiSkeleton]="true">
		<header tuiHeader>
			<h2 tuiTitle>
				Тренировка
				<span tuiSubtitle>Следующая тренировка</span>
			</h2>
		</header>
	</div>
	@if (next(); as workout) {
		<a appearance="neutral" tuiCardLarge [routerLink]="['/workouts', workout.id]">
			<header tuiHeader>
				<h2 tuiTitle>
					{{ workout.name }}
					<span tuiSubtitle>Следующая тренировка</span>
				</h2>
			</header>
			<footer class="flex items-center justify-between gap-3">
				<span appearance="neutral" tuiBadge>{{ exerciseCount() }}</span>
				<span class="text-accent">Открыть</span>
			</footer>
		</a>
	}
</app-resource-state>
